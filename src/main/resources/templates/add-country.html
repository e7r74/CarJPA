<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main.html}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div layout:fragment="mainFragment">
        <form method="post" th:action="${'/addcountry'}">
            <h1>Add country</h1>
            <div>
                <input type="text"
                       id="country_name"
                       name="country_name"
                       placeholder="country_name"
                        >
                <label for="country_name">Name</label>
            </div>
            <div>
                <input type="text"
                       maxlength="3"
                       id="country_code"
                       name="country_code"
                       placeholder="country_code" >
                <label for="country_code">Code</label>
            </div>
            <button type="submit">Save</button>
        </form>
    </div>
</body>
</html>
