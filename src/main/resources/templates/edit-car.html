<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
  <meta charset="UTF-8">
  <title>Edit Car</title>
</head>
<body>

<div layout:fragment="mainFragment">
  <div class="col-6 offset-3 mt-5 pt-4">
    <form class="card px-3 py-3 mt-2"
          method="post"
          th:action="@{/updatecar}">

      <h2 class="text-center mb-3">Edit Car</h2>

      <div class="alert alert-danger mb-3"
           role="alert"
           th:if="${param.countryNotFound != null}">
        You have chosen an invalid country or your car does not exist!
      </div>

      <!-- ИСПРАВЛЕНИЕ 1: name="id" вместо name="car_id" -->
      <input type="hidden"
             name="id"
             th:value="${car.id}">

      <div class="form-floating mb-3">
        <input type="text"
               class="form-control"
               id="car_name"
               placeholder="car_name"
               name="name"
               th:value="${car.name}"
               required>
        <label for="car_name">Name (Brand)</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text"
               class="form-control"
               id="car_model"
               placeholder="car_model"
               name="model"
               th:value="${car.model}"
               required>
        <label for="car_model">Model</label>
      </div>

      <div class="form-floating mb-3">
        <input type="number"
               class="form-control"
               id="car_year"
               placeholder="car_year"
               name="year"
               th:value="${car.year}"
               required>
        <label for="car_year">Year of manufacture</label>
      </div>

      <div class="form-floating mb-3">
        <input type="number"
               class="form-control"
               id="car_price"
               placeholder="car_price"
               name="price"
               th:value="${car.price}"
               required>
        <label for="car_price">Price</label>
      </div>

      <!-- ИСПРАВЛЕНИЕ 2: name="country.id" вместо name="country" -->
      <div class="form-floating mb-3">
        <select class="form-select"
                id="country_id"
                name="country.id"
                required>
          <option th:each="country : ${countries}"
                  th:value="${country.id}"
                  th:text="${country.name + ' / ' + country.code}"
                  th:selected="${car.country != null and country.id == car.country.id}">
          </option>
        </select>
        <label for="country_id">Country-manufacturer</label>
      </div>

      <div class="d-grid gap-2 col-4 mx-auto mt-3">
        <button class="btn btn-success" type="submit">SAVE</button>
      </div>

    </form>
  </div>
</div>

</body>
</html>
